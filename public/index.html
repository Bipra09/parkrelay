<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ParkRelay</title><link rel="stylesheet" href="style.css"><body><header><h1>ParkRelay</h1><p>Manage parking occupancy, tickets, and fees.</p></header><main><section><h2>Garage status</h2><p id="capacity"></p><ul id="spots"></ul></section><section><h2>Vehicle entry</h2><form id="entry"><label>Plate<input name="plate" required maxlength="12"></label><label>Vehicle type<select name="type"><option>car</option><option>motorcycle</option></select></label><button>Issue ticket</button></form></section><section><h2>Checkout</h2><form id="exit"><label>Ticket ID<input name="ticket" required></label><button>Close ticket and calculate fee</button></form><output id="status" aria-live="polite"></output></section><section><h2>Recent exits</h2><ul id="history"></ul></section></main><script type="module" src="app.js"></script></body></html>
